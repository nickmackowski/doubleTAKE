# The installer's settings for DoubleTake: Rocky Linux's own, with DoubleTake's name and look.

[Product]
product_name = DoubleTake on Rocky Linux

[Base Product]
product_name = Rocky Linux

[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/doubletake.css
# Already set by the install script, so not shown: only time, network, the drive and the
# user are left to look at. (Installation Source stays, for when the Wi-Fi step was skipped.)
hidden_spokes =
    KeyboardSpoke
    LangsupportSpoke
    SoftwareSelectionSpoke
    PasswordSpoke
    KdumpSpoke
    OSCAPSpoke
