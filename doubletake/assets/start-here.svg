<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- The DoubleTake ring, as on the boot screen, drawn thicker to read at the top bar's size. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FE7800"/>
      <stop offset="1" stop-color="#33D079"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#ring)" stroke-width="9"/>
</svg>
